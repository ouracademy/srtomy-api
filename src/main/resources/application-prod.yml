spring:
  datasource:
    url: ${sm@db-url}
    username: ${sm@db-user}
    password: ${sm@db-password}
    # Kept small on purpose: originally sized for ElephantSQL's free tier
    # (long gone), now backed by Neon's free tier (see infra/terraform) —
    # low traffic either way. Don't raise this without checking Neon's
    # connection limit for whatever compute size is active; a pool bigger
    # than the DB's own limit can starve other clients or fail to connect
    # under load.
    hikari.maximumPoolSize: 2

# Resend (https://resend.com) delivers the invitation emails. Without the key they are only logged.
resend:
  api-key: ${sm@resend-api-key:}
  # Must belong to a domain verified in Resend, or it only delivers to the account owner.
  from: ${RESEND_FROM:Sr. Tommy <invitaciones@ovejafiel.com>}
  reply-to: ${RESEND_REPLY_TO:}

# Kapso (https://kapso.ai) connects the WhatsApp of each church and delivers the messages. Without
# the key nothing leaves the log. The webhook secret signs what Kapso calls us with.
kapso:
  api-key: ${sm@kapso-api-key:}
  webhook-secret: ${sm@kapso-webhook-secret:}
  success-redirect-url: ${KAPSO_SUCCESS_REDIRECT_URL:}
  failure-redirect-url: ${KAPSO_FAILURE_REDIRECT_URL:}

# Signs the code in the attendance QR of an event (Terraform generates the secret). Without it the
# QR cannot be made.
attendance:
  qr-secret: ${sm@attendance-qr-secret:}

# Cloud Tasks delivers the outbox messages (emails): one task per message calls
# POST /v1/internal/outbox/{id}/attempt on this service. Without the project and the URL messages
# are delivered once, right after the commit, and never retried (local runs).
tasks:
  project: ${TASKS_PROJECT:}
  location: ${TASKS_LOCATION:southamerica-east1}
  target-url: ${TASKS_TARGET_URL:}

# Attempts before a message is given up: the same number as max_attempts of the queues in
# infra/terraform/modules/tasks.
outbox:
  max-attempts: 10

# Cloud Scheduler and Cloud Tasks call /v1/internal/** with a Google ID token of this service account (Terraform:
# modules/scheduler). With no account set, every call is refused.
internal:
  scheduler-email: ${INTERNAL_SCHEDULER_EMAIL:}
