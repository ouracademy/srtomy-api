spring:
  datasource:
    url: ${sm@db-url}
    username: ${sm@db-user}
    password: ${sm@db-password}
    # Kept small on purpose: originally sized for ElephantSQL's free tier
    # (long gone), now backed by Neon's free tier (see infra/terraform) —
    # low traffic either way. Don't raise this without checking Neon's
    # connection limit for whatever compute size is active; a pool bigger
    # than the DB's own limit can starve other clients or fail to connect
    # under load.
    hikari.maximumPoolSize: 2

# Resend (https://resend.com) delivers the invitation emails. Without the key they are only logged.
resend:
  api-key: ${sm@resend-api-key:}
  # Must belong to a domain verified in Resend, or it only delivers to the account owner.
  from: ${RESEND_FROM:Sr. Tommy <invitaciones@ovejafiel.com>}
  reply-to: ${RESEND_REPLY_TO:}

# Cloud Scheduler calls /v1/internal/** with a Google ID token of this service account (Terraform:
# modules/scheduler). With no account set, every call is refused.
internal:
  scheduler-email: ${INTERNAL_SCHEDULER_EMAIL:}
