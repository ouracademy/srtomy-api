# See AGENTS.md for the conventions this workflow enforces (commits, code
# style, language policy).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  build-test:
    name: build, tests, format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: build, unit tests, spotless:check
        run: ./mvnw -B -ntp verify

  language-check:
    name: language policy (code must be in English)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-language.py

  commit-lint:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: validate commit messages
        run: |
          source .githooks/lib/validate-message.sh

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
            # First push of a new branch: github.event.before is all zeros.
            case "${{ github.event.before }}" in
              0000000000000000000000000000000000000000* | "")
                range="${{ github.sha }}"
                ;;
            esac
          fi

          failed=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            validate_commit_subject "$subject" || failed=1
          done < <(git log --format='%s' "$range")

          exit $failed

  sonar:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: static analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B -ntp verify sonar:sonar

  security:
    name: secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: secrets (full history)
        run: gitleaks git . --redact --no-banner
      - name: install osv-scanner
        env:
          OSV_VERSION: v2.5.1
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
      - name: dependency vulnerabilities
        run: osv-scanner scan source -r .
