# Deploys to Cloud Run (sr-tommy-dev) automatically after `ci` passes on
# main. GCP identity/registry/WIF setup lives in infra/terraform — see
# infra/terraform/README.md for how DEV_WORKLOAD_IDENTITY_PROVIDER,
# DEV_DEPLOY_SERVICE_ACCOUNT and DEV_ARTIFACT_REGISTRY_URL (repo variables,
# not secrets — none of these are sensitive on their own) get their values.
name: deploy (dev)

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write # required to mint a Workload Identity Federation token
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEV_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker southamerica-west1-docker.pkg.dev --quiet

      - name: Build image with Cloud Native Buildpacks
        run: |
          ./mvnw -q -B -DskipTests spring-boot:build-image \
            -Dspring-boot.build-image.imageName=${{ vars.DEV_ARTIFACT_REGISTRY_URL }}:${{ github.sha }} \
            -Dspring-boot.build-image.builder=gcr.io/buildpacks/builder

      - name: Push image
        run: docker push ${{ vars.DEV_ARTIFACT_REGISTRY_URL }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: sr-tommy-api
          region: southamerica-west1
          project_id: sr-tommy-dev
          image: ${{ vars.DEV_ARTIFACT_REGISTRY_URL }}:${{ github.sha }}
          # Cloud Run's own IAM layer must allow unauthenticated invocation —
          # srtomy-ui calls this from end users' browsers, not as a
          # GCP-authenticated caller. The app's own JWT check
          # (SecurityConfig) is a separate, additional layer on top; this
          # flag does not weaken it.
          #
          # --memory/--cpu-boost: Cloud Run's 512Mi default isn't enough for
          # this Spring Boot app's startup (JVM + Hibernate + GCP client
          # libs) — it was hitting the memory ceiling mid-startup, slowing
          # it down just enough to miss the startup probe's timeout.
          flags: --allow-unauthenticated --memory=1Gi --cpu=1 --cpu-boost
