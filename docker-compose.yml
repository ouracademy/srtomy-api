services:
  dbpostgresql:
    image: postgres:16-alpine
    ports:
      - "5432:5432" # pc_port:container_port
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=somesecretpassword
      - POSTGRES_DB=srtommy
    volumes:
      - dbvol:/var/lib/postgresql/data
volumes:
  dbvol:
    driver: local
